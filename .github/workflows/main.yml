# Builds the package, runs the tests, and publishes to PyPI when a tag is pushed
# (e.g. `git tag v0.1.0b1 && git push origin v0.1.0b1`).
# Uses PyPI trusted publishing (no API token): add this repository as a trusted publisher at
# https://pypi.org/manage/account/publishing/ with workflow "main.yml" and environment "pypi".

name: Publish to PyPI

on:
  push:
    tags:
      - "*" # only run on tag pushes

jobs:
  pypi-publish:
    name: Publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cpt-vs-tool
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          python -m pytest
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
